<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2 class="text-brand">Connexion<span class="dot">.</span></h2>
      <p>Accédez à votre espace commerçant</p>
    </div>

    <form class="auth-form">
      <div class="form-input-group">
        <label for="username">Nom d'utilisateur</label>
        <div class="input-with-icon">
          <i class='bx bx-user'></i>
          <input type="text" id="username" placeholder="Entrez votre nom d'utilisateur" name="username" required>
        </div>
      </div>

      <div class="form-input-group">
        <label for="password">Mot de passe</label>
        <div class="input-with-icon">
          <i class='bx bx-lock-alt'></i>
          <input type="password" id="password" placeholder="••••••••" name="password" required>
        </div>
        <div class="text-end mt-2">
          <a routerLink="/authentification/mot-de-passe-oublie" class="forgot-password-link">Mot de passe oublié ?</a>
        </div>
      </div>

      <button type="submit" class="btn btn-brand w-100 mt-3">Se connecter</button>
    </form>

    <div class="auth-footer">
      <p>Pas encore de compte ? <a routerLink="/authentification/inscription">S'inscrire</a></p>
    </div>
  </div>
</div>
