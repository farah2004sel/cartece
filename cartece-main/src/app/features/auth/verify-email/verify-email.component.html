<form [formGroup]="formEmail" (ngSubmit)="onSubmit()">

  <label>Email</label>
  <input type="email"
         formControlName="email"
         class="form-control"/>

  <div *ngIf="formEmail.get('email')?.touched && formEmail.get('email')?.invalid" style="color:red">
    Email requis et doit être valide
  </div>

  <label>Code</label>
  <input type="text"
         formControlName="code"
         class="form-control"/>

  <div *ngIf="formEmail.get('code')?.touched && formEmail.get('code')?.invalid" style="color:red">
    Code requis
  </div>

  <div *ngIf="errorMessage" style="color:red; margin-bottom:10px;">
    {{ errorMessage }}
  </div>

  <button type="submit" [disabled]="loading">
    {{ loading ? 'Vérification...' : 'Vérifier' }}
  </button>

</form>
