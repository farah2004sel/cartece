<div class="auth-container">
    <div class="profile-card">
      <div class="text-center mb-4">
        <h2>Profil Professionnel</h2>
        <p class="small text-muted">
          Ces informations seront utilisées pour vos futures demandes.
        </p>
      </div>
  
      <form (ngSubmit)="saveProfile()">
  
        <div class="form-group">
          <label>Nom</label>
          <input type="text" [(ngModel)]="profile.nom" name="nom" placeholder="Entrez le nom" required>
        </div>
  
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="profile.prenom" name="prenom" placeholder="Entrez le prénom" required>
        </div>
  
        <div class="form-group">
          <label>Date de naissance</label>
          <input type="date" [(ngModel)]="profile.dateNaissance" name="dateNaissance" required>
        </div>
  
        <div class="form-group">
          <label>Nationalité</label>
          <input type="text" [(ngModel)]="profile.nationalite" name="nationalite" placeholder="Entrez la nationalité" required>
        </div>
  
        <button type="submit" [disabled]="loading">
          <span *ngIf="!loading">Enregistrer</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        </button>
  
      </form>
    </div>
  </div>
