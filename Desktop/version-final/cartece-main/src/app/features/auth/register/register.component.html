<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2 class="text-brand">Inscription<span class="dot">.</span></h2>
      <p>Créez votre compte commerçant étranger</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
       <div class="form-input-group mb-4">
        <label class="d-block mb-3">Type de personne</label>
        <div class="d-flex gap-4">
          <div class="form-check custom-radio">
            <input class="form-check-input" type="radio" name="personType" id="physique" value="physique"
                   [(ngModel)]="personType">
            <label class="form-check-label" for="physique">Personne physique</label>
          </div>
          <div class="form-check custom-radio">
            <input class="form-check-input" type="radio" name="personType" id="morale" value="morale"
                   [(ngModel)]="personType">
            <label class="form-check-label" for="morale">Personne morale</label>
          </div>
          
        </div>
      </div>

       <div class="form-input-group">
        <label for="fullName">{{ nameLabel }}</label>
        <div class="input-with-icon">
          <i class='bx' [ngClass]="personType === 'physique' ? 'bx-user' : 'bx-buildings'"></i>
          <input type="text" id="fullName" 
                 [placeholder]="namePlaceholder" 
                 name="fullName" 
                 required
                 [(ngModel)]="commercant.fullName">
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="form-input-group">
            <label for="email">E-mail</label>
            <div class="input-with-icon">
              <i class='bx bx-envelope'></i>
              <input type="email" id="email" name="email" required [(ngModel)]="commercant.email">
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-input-group">
            <label for="telephone">Numéro de téléphone</label>
            <div class="input-with-icon">
              <i class='bx bx-phone'></i>
              <input type="tel" id="telephone" placeholder="+216 00 000 000" name="telephone" required>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="form-input-group">
            <label for="nationalite">Nationalité</label>
            <div class="input-with-icon">
              <i class='bx bx-world'></i>
              <input type="text" id="nationalite" name="nationalite" required [(ngModel)]="commercant.nationalite">
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-input-group">
            <label for="password">Mot de passe</label>
            <div class="input-with-icon">
              <i class='bx bx-lock-alt'></i>
              <input type="password" id="password" name="password" required [(ngModel)]="commercant.password">
            </div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-brand w-100 mt-3 p-3 fw-bold">Créer le compte</button>
    </form>

    <div class="auth-footer">
      <p>Déjà inscrit ? <a routerLink="/auth/login">Se connecter</a></p>
    </div>
  </div>
</div>
