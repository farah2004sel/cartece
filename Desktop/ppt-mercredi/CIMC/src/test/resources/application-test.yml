spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    generate-ddl: true
    open-in-view: true
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    change-log: classpath:db/db.changelog-master.xml
    contexts: test
    enabled: false
    drop-first: true

  security:
    cors:
      origin: http://localhost:4200
      max-age: 3600



