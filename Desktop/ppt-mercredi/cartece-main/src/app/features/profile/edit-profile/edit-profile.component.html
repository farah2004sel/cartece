<div class="auth-container d-flex align-items-center justify-content-center min-vh-100 bg-light py-5">
  <div class="profile-card shadow-lg p-5 bg-white rounded-4 border-top border-5 border-danger">

    <div class="text-center mb-5">
      <div class="icon-circle bg-light-danger text-danger mx-auto mb-3">
        <i class='bx bx-id-card fs-1'></i>
      </div>
      <h2 class="fw-bold">Profil Professionnel</h2>
      <p class="text-muted small">
        Ces informations seront enregistrées une seule fois et utilisées dans vos demandes ultérieures.
      </p>
    </div>

    <form *ngIf="profileForm" [formGroup]="profileForm" (ngSubmit)="save()">

      <!-- Type personne -->
      <div class="mb-3">
        <label class="form-label">Type de personne</label>
        <select class="form-control" formControlName="typePersonne">
          <option value="physique">Personne physique</option>
          <option value="morale">Personne morale</option>
        </select>
      </div>

      <!-- PERSONNE PHYSIQUE -->
      <div *ngIf="profileForm.value.typePersonne === 'physique'" class="mb-3">
        <label class="form-label">Nom complet</label>
        <input type="text" formControlName="repName" class="form-control" placeholder="Nom complet">
      </div>

      <!-- PERSONNE MORALE -->
      <div *ngIf="profileForm.value.typePersonne === 'morale'" class="mb-3">
        <label class="form-label">Nom de l'entreprise</label>
        <input type="text" formControlName="societe" class="form-control" placeholder="Nom de l'entreprise">
      </div>

      <!-- Forme juridique -->
      <div *ngIf="profileForm.value.typePersonne === 'morale'" class="mb-3">
        <label class="form-label">Forme juridique</label>
        <input type="text" formControlName="legalForm" class="form-control" placeholder="SARL, SA...">
      </div>

      <!-- Nationalité -->
      <div class="mb-3">
        <label class="form-label">Nationalité</label>

        <mat-form-field appearance="outline" class="w-100">
          <mat-select formControlName="nationaliteId" placeholder="Sélectionnez votre nationalité">
            <mat-option *ngFor="let n of nationalites" [value]="n.id">
              <img [src]="n.flagUrl" width="20" height="14" class="me-2">
              {{ n.nom }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Nationalité représentant -->
      <div *ngIf="profileForm.value.typePersonne === 'morale'" class="mb-3">
        <label class="form-label">Nationalité du représentant</label>
        <input type="text" formControlName="repNationality" class="form-control">
      </div>

      <!-- Date naissance -->
      <div class="mb-3">
        <label class="form-label">Date de naissance / de création</label>
        <input type="date" formControlName="birthDate" class="form-control">
      </div>

      <!-- Lieu naissance -->
      <div class="mb-3">
        <label class="form-label">Lieu de naissance / de création</label>
        <input type="text" formControlName="birthPlace" class="form-control" placeholder="Ville, Pays">
      </div>

      <!-- Date résidence -->
      <div class="mb-3">
        <label class="form-label">Date de résidence</label>
        <input type="date" formControlName="residenceDate" class="form-control">
      </div>

      <!-- Adresse -->
      <div class="mb-3">
        <label class="form-label">Adresse</label>
        <textarea formControlName="address" class="form-control" rows="3"></textarea>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-danger w-100" [disabled]="loading">
        <span *ngIf="!loading">Enregistrer les données</span>
        <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
      </button>

    </form>
  </div>
</div>
