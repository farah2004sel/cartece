<div class="auth-hero-wrapper">
  <div class="hero-overlay"></div>

  <div class="container d-flex justify-content-center align-items-center py-5 position-relative">
    <div class="auth-card glass-card animate__animated animate__fadeIn">

      <div class="auth-header text-center mb-4">
        <h2 class="fw-bold">
          Inscription<span class="dot">.</span>
        </h2>
        <p class="text-muted">Créez votre compte commerçant étranger</p>
      </div>

      <form [formGroup]="RegisterForm" (ngSubmit)="onSubmit()" class="auth-form">

        <!-- TYPE PERSONNE SELECTOR (Advanced Cards) -->
        <div class="type-selector mb-4">
          <div class="card-option" [class.active]="RegisterForm.get('type')?.value === 'physique'"
            (click)="RegisterForm.get('type')?.setValue('physique')">
            <i class='bx bx-user'></i>
            <span>Physique</span>
          </div>
          <div class="card-option" [class.active]="RegisterForm.get('type')?.value === 'morale'"
            (click)="RegisterForm.get('type')?.setValue('morale')">
            <i class='bx bx-buildings'></i>
            <span>Morale</span>
          </div>
        </div>

        <div class="row g-3">
          <!-- NOM / DENOMINATION -->
          <div class="col-12">
            <div class="form-input-group">
              <label>
                {{ RegisterForm.get('type')?.value === 'physique' ? 'Nom complet' : 'Dénomination sociale' }}
              </label>
              <div class="input-with-icon">
                <i class='bx'
                  [ngClass]="RegisterForm.get('type')?.value === 'physique' ? 'bx-user' : 'bx-buildings'"></i>
                <input type="text" formControlName="nom" class="form-control" placeholder="Saisir ici...">
              </div>
              <small class="text-danger" *ngIf="f['nom'].touched && f['nom'].errors?.['required']">Ce champ est
                obligatoire.</small>
            </div>
          </div>

          <!-- EMAIL -->
          <div class="col-md-6">
            <div class="form-input-group">
              <label>Email professionnel</label>
              <div class="input-with-icon">
                <i class='bx bx-envelope'></i>
                <input type="email" formControlName="email" class="form-control" placeholder="exemple@mail.com">
              </div>
              <small class="text-danger"
                *ngIf="f['email'].touched && (f['email'].errors?.['required'] || f['email'].errors?.['email'])">Email
                invalide.</small>
            </div>
          </div>

          <!-- TELEPHONE -->
          <div class="col-md-6">
            <div class="form-input-group">
              <label>Téléphone</label>
              <div class="input-with-icon">
                <i class='bx bx-phone'></i>
                <input type="text" formControlName="telephone" class="form-control" placeholder="8 chiffres">
              </div>
              <small class="text-danger" *ngIf="f['telephone'].touched && f['telephone'].errors">Format
                incorrect.</small>
            </div>
          </div>

          <!-- NATIONALITE -->
          <div class="col-12">
            <div class="form-input-group">
          
              <label>Nationalité d'origine</label>
          
              <mat-form-field appearance="outline" class="w-100">
          
                <mat-select formControlName="nationaliteId" placeholder="Sélectionner votre pays">
          
                  <mat-option *ngFor="let n of nationalites" [value]="n.id">
          
                    <img [src]="n.flagUrl" class="flag-icon">
                    {{ n.nom }}
          
                  </mat-option>
          
                </mat-select>
          
              </mat-form-field>
          
            </div>
          </div>

          <!-- PASSWORD -->
          <div class="col-12">
            <div class="form-input-group">
              <label>Mot de passe</label>
              <div class="input-with-icon">
                <i class='bx bx-lock-alt'></i>
                <input type="password" formControlName="password" class="form-control" placeholder="8 caractères min.">
              </div>
              <small class="text-danger" *ngIf="f['password'].touched && f['password'].errors">Sécurité
                insuffisante.</small>
            </div>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3 py-2 small">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-brand w-100 mt-4" [disabled]="loading || RegisterForm.invalid">
          <span *ngIf="!loading">Créer mon compte <i class="bx bx-check-circle ms-1"></i></span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        </button>

      </form>

      <div class="auth-footer mt-4">
        <p>Déjà inscrit ?
          <a routerLink="/auth/login" class="fw-bold">Se connecter</a>
        </p>
      </div>

    </div>
  </div>
</div>
